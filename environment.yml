# Environnement conda de reproduction.
#
#   conda env create -f environment.yml
#   conda activate htam
#
# Les versions sont celles qui ont servi à produire les résultats publiés. Elles sont fixées
# volontairement : une version plus récente de scikit-learn peut changer la dernière décimale
# d'une AUC, et il vaut mieux que le lecteur retrouve les chiffres exacts avant de mettre à
# jour quoi que ce soit.
name: htam
channels:
  - conda-forge
dependencies:
  - python=3.9
  - numpy=1.26.4
  - scipy=1.13.1
  - pandas=2.3.1
  - scikit-learn=1.6.1
  - statsmodels=0.14.6
  - matplotlib=3.9.4
  - openpyxl=3.1.5
